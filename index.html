<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Italiano A1/A2 — Ejercicios</title>

  <!-- Pico CSS 2.1.1 (classless variant) — SRI pinned per RESEARCH.md 2026-05-23 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css"
        integrity="sha384-NZhm4G1I7BpEGdjDKnzEfy3d78xvy7ECKUwwnKTYi036z42IyF056PbHfpQLIYgL"
        crossorigin="anonymous">

  <link rel="stylesheet" href="./styles.css">

  <!--
    Defer-load Alpine until main.js terminó de cargar el contenido y registró
    `Alpine.data('sessionScreen', ...)`. Sin este patrón, Alpine arrancaría
    en cuanto su script defer evalúe (antes de que main.js, también deferred,
    ejecute su cuerpo async), escanearía el DOM, encontraría
    `x-data="sessionScreen"` sin factory y dejaría los templates sin
    expandir. Referencia: alpinejs.dev/essentials/installation#deferring-alpine.
  -->
  <script>
    window.__appReady = new Promise((resolve) => {
      window.__resolveAppReady = resolve;
    });
    window.deferLoadingAlpine = function (startAlpine) {
      window.__appReady.then(() => startAlpine());
    };
  </script>

  <!-- Alpine.js 3.15.12 — SRI pinned per RESEARCH.md 2026-05-23. -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
          integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
          crossorigin="anonymous"></script>

  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main>
    <h1>Italiano A1/A2</h1>
    <!-- Banner de errores de validación (oculto por defecto; main.js lo rellena). -->
    <div id="error-banner" hidden></div>
    <!-- Placeholder mientras se carga el contenido. main.js lo remueve antes de
         que Alpine procese el árbol del componente. -->
    <div id="app-placeholder">Cargando…</div>

    <!--
      Pantalla de sesión Alpine (Plan 02).

      `x-cloak` evita FOUC mientras Alpine inicializa el componente.
      `x-init="init()"` dispara el buildSession en cuanto el x-data monta.

      Tres templates condicionales (mutuamente exclusivos):
        1. `ready && !done` — sesión activa: prompt + opciones + feedback.
        2. `ready && done`  — sesión terminada (stub minimal; Phase 2 añade resumen).
        3. `!ready`         — pool vacío (D-13 edge case, inalcanzable con el seed).

      Seguridad (T-01-02 + T-02-01): TODO el contenido del JSON se renderiza
      vía `x-text` (textContent) — jamás `x-html`. Si un prompt contiene
      `<script>` o markup peligroso, se mostrará como texto literal.
    -->
    <div x-data="sessionScreen" x-init="init()" x-cloak>
      <template x-if="ready && !done">
        <article>
          <!-- SESSION-04: indicador "Ejercicio X / N" visible toda la sesión. -->
          <header x-text="progressLabel"></header>

          <p x-text="currentExercise.payload.prompt"></p>

          <div role="group">
            <template x-for="(opt, idx) in currentExercise.payload.options" :key="idx">
              <button type="button"
                      @click="selectOption(idx)"
                      :disabled="feedback !== null"
                      :class="{
                        'correcta': feedback !== null && idx === currentExercise.payload.correctIndex,
                        'incorrecta': feedback === 'incorrect' && idx === selectedIndex
                      }"
                      x-text="opt"></button>
            </template>
          </div>

          <!-- Solo en respuesta incorrecta: muestra la correcta + botón Siguiente. -->
          <p x-show="feedback === 'incorrect'">
            Respuesta correcta:
            <strong x-text="currentExercise.payload.options[currentExercise.payload.correctIndex]"></strong>
          </p>
          <button x-show="feedback === 'incorrect'" @click="advance">Siguiente</button>
        </article>
      </template>

      <template x-if="ready && done">
        <article>
          <p>Sesión terminada. Recarga la página para empezar otra.</p>
        </article>
      </template>

      <template x-if="!ready">
        <article>
          <p>No hay ejercicios disponibles. Añade ejercicios a <code>content/exercises/avere.json</code>.</p>
        </article>
      </template>
    </div>
  </main>
</body>
</html>
