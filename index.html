<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Italiano A1/A2 — Ejercicios</title>

  <!-- Pico CSS 2.1.1 (classless variant) — SRI pinned per RESEARCH.md 2026-05-23 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css"
        integrity="sha384-NZhm4G1I7BpEGdjDKnzEfy3d78xvy7ECKUwwnKTYi036z42IyF056PbHfpQLIYgL"
        crossorigin="anonymous">

  <link rel="stylesheet" href="./styles.css">

  <!--
    main.js se carga ANTES que Alpine para garantizar que su listener
    `alpine:init` quede registrado de forma síncrona en el top-level del
    módulo, ANTES de que Alpine emita el evento. Alpine luego carga (defer)
    y al arrancar emite `alpine:init` con nuestro listener ya en su sitio,
    listo para registrar el factory `appShell` justo antes del DOM scan.
  -->
  <script type="module" src="./src/main.js"></script>

  <!-- Alpine.js 3.15.12 — SRI pinned per RESEARCH.md 2026-05-23. -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
          integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
          crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <h1>Italiano A1/A2</h1>
    <!-- Banner de errores de validación (oculto por defecto; main.js lo rellena). -->
    <div id="error-banner" hidden></div>
    <!-- Placeholder mientras se carga el contenido. main.js lo remueve antes de
         que Alpine procese el árbol del componente. -->
    <div id="app-placeholder">Cargando…</div>

    <!--
      App shell Alpine (Plan 02-03).

      `x-cloak` evita FOUC mientras Alpine inicializa el componente.
      `x-init="init()"` dispara el await de `appDataReady` cuando el x-data monta.

      Cuatro pantallas mutuamente excluyentes vía `currentScreen` (D-24):
        1. home    — tabla densa de categorías + dos botones grandes.
        2. picker  — checkboxes compartidos entre Repaso y Test completo (D-33).
        3. session — multiple-choice migrada de Phase 1 con prefijo `session*` (D-25).
        4. summary — stub en Plan 02-03; poblado en Plan 02-04.

      Confirmación inline (D-27) renderizada al final del x-data root como un
      panel discreto reusable (Plan 02-04 lo reusará para D-43 y D-44).

      Seguridad (T-02-01): TODO el contenido del JSON se renderiza via `x-text`
      (textContent) — jamás la directiva contraria. Si un prompt contiene
      `<script>` o markup peligroso, se mostrará como texto literal.
    -->
    <div x-data="appShell" x-init="init()" x-cloak>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla HOME (D-24, D-29, D-30, D-32)                            -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <template x-if="currentScreen === 'home'">
        <article>
          <header>
            <h2>Categorías</h2>
          </header>

          <!--
            Banner in-flight Test completo (D-43, Plan 02-04). Visible
            persistente mientras `state.inFlightTest` tenga ejercicios sin
            responder. Color amarillo sutil — alerta clara pero sin alarmismo.
            Orden vertical: banner → botones grandes → tabla (CONTEXT.md
            "orden vertical sugerido").

            UAT 02-04 round 1 fix (DOBLE DEFENSA — patrón canónico Plan 02-03):
            antes este bloque usaba `x-show="state.inFlightTest"` con bindings
            `state.inFlightTest?.cursor`. El `?.` NO protege el primer acceso a
            `.inFlightTest` cuando `state` mismo es `null` durante el boot (en
            el tick entre `Alpine.start()` y `init()` resolviendo `appDataReady`).
            Resultado: TypeError visible en consola tras cada recarga.

            Fix: outer `<template x-if="inFlightTestActive">` (getter defensivo
            en src/screens/app.js que devuelve `false` cuando `state` es null).
            El template gate evita que los bindings internos se evalúen hasta
            que el state esté cargado Y haya un inFlightTest con ejercicios
            pendientes. INSIDE the x-if, los bindings usan `inFlightTestProgress.X`
            con acceso DIRECTO (sin `?.`) — el getter garantiza que el subtree
            no se monta cuando el objeto es null.
          -->
          <template x-if="inFlightTestActive">
            <div role="alert" class="inflight-banner">
              ⚠ Tienes un Test completo a medias
              (<span x-text="inFlightTestProgress.cursor"></span>
              / <span x-text="inFlightTestProgress.total"></span> ejercicios).
              <!--
                `.button-row` en vez de `role="group"`: Pico's button group une
                los bordes (parecen un solo control). UAT 02-04 round 2 detectó
                el problema en el picker; aplicamos el mismo fix preventivo aquí
                en el banner para evitar redescubrirlo en una ronda futura.
                `margin-top` inline en lugar del `margin: 1.5rem 0` por defecto
                de `.button-row` — el banner es compacto y el wrapper exterior
                ya tiene padding.
              -->
              <div class="button-row" style="margin: 0.5rem 0 0 0;">
                <button type="button" @click="resumeInFlightTest">Reanudar</button>
                <button type="button" class="secondary" @click="discardInFlightTestWithConfirm">Descartar</button>
              </div>
            </div>
          </template>

          <!--
            Banner backup (D-80, Phase 4). Mismo patrón visual que .inflight-banner:
            <template x-if> con outer-gate getter null-safe (shouldShowBackupBanner
            devuelve false si state aún no cargó), role="alert", border ámbar.
            Aparece automáticamente cuando han pasado >7 días desde lastBackupAt
            (o desde firstUsedAt si lastBackupAt es null per D-78); desaparece
            al exportar (Alpine reactivity sobre state.lastBackupAt).
            Sin snooze ni dismiss — el sistema te obliga (filosofía Phase 1).
          -->
          <template x-if="shouldShowBackupBanner">
            <div role="alert" class="backup-banner">
              ⚠ <span x-text="backupBannerText"></span>
              <button type="button" class="secondary" @click="currentScreen = 'backup'">Ir a Backup</button>
            </div>
          </template>

          <!--
            Tres botones lado a lado (D-32 + D-81 Phase 4). Usamos `.button-row`
            (clase genérica reusable en cualquier sitio con botones adyacentes) +
            `.button-row-prominent` (variante con font-size/padding extra para
            acciones primarias) en vez de `role="group"` porque Pico's button
            group une los bordes (parecen un solo control) y UAT 02-03 detectó
            que los dos botones se veían "pegados y casi como un título". El
            mismo patrón reapareció en el picker en UAT 02-04 round 2, motivo
            por el que `.home-actions` se generalizó a `.button-row`.

            D-81: el tercer botón `Backup` usa `class="secondary"` (Pico muted
            cyan) — no compite con los protagonistas Repaso/Test completo.
            Visible siempre, descubrible sin depender del banner.
          -->
          <div class="button-row button-row-prominent">
            <button type="button" @click="openPicker('repaso')">Repaso 20</button>
            <button type="button" @click="openPicker('test-completo')">Test completo</button>
            <button type="button" class="secondary" @click="currentScreen = 'backup'">Backup</button>
          </div>

          <!-- Tabla densa (D-29) con 5 columnas exactas. -->
          <figure>
            <table>
              <thead>
                <tr>
                  <th scope="col">Estado</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Racha</th>
                  <th scope="col">Ejercicios</th>
                  <th scope="col">Última vez</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="cat in categoriesForDisplay" :key="cat.id">
                  <tr>
                    <td>
                      <span :class="`badge-${cat.status}`"
                            :aria-label="cat.statusLabel"
                            x-text="cat.badgeGlyph"></span>
                    </td>
                    <td x-text="cat.name"></td>
                    <td x-text="cat.streakLabel"></td>
                    <td x-text="cat.totalCount"></td>
                    <td x-text="cat.lastPracticedLabel"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </figure>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla PICKER (D-24, D-33, D-34, D-35, D-36)                    -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <template x-if="currentScreen === 'picker'">
        <article>
          <header>
            <h2 x-text="pickerHeaderLabel"></h2>
          </header>

          <!--
            Botones de selección masiva. UAT 02-04 round 2: con `role="group"`
            los dos botones se veían "pegados, no parecen dos botones, parecen
            un título" — mismo root cause que en la home (UAT 02-03). Fix:
            `.button-row` (gap visible + flex layout). Misma clase reusable
            que el home y el banner in-flight.
          -->
          <div class="button-row">
            <button type="button" class="secondary" @click="pickerSelectAll">Seleccionar todo</button>
            <button type="button" class="secondary" @click="pickerClearAll">Quitar todo</button>
          </div>

          <!-- Checkboxes por categoría (D-34: vacíos al entrar). -->
          <fieldset>
            <template x-for="cat in content.categories" :key="cat.id">
              <label>
                <input type="checkbox"
                       :value="cat.id"
                       :checked="pickerCheckedCategoryIds.includes(cat.id)"
                       @change="pickerToggleCategory(cat.id)">
                <span x-text="cat.name"></span>
              </label>
            </template>
          </fieldset>

          <!-- Botón Empezar con label dinámico (D-35). -->
          <button type="button"
                  @click="startSession"
                  :disabled="pickerPoolSize === 0"
                  x-text="pickerStartLabel"></button>

          <!-- Aviso inline para Test completo (D-36) — texto plano en español. -->
          <p x-show="pickerMode === 'test-completo' && pickerPoolSize > 0" class="picker-warning">
            ⚠ Test completo — <span x-text="pickerPoolSize"></span> ejercicios sin tope. Se puede reanudar si lo cierras a medias.
          </p>

          <hr>
          <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla SESSION (D-24, D-25 — migrado íntegro de Phase 1)        -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Guard `&& sessionCurrentExercise` (UAT 02-03 finding 2 — segundo nivel
        de defensa, complementa el getter defensivo). Alpine reevalúa los
        bindings de un x-if UNA VEZ con el state nuevo antes de desmontarlo
        (tick de unmount). Cuando `completeSession()` o el modal de descartar
        cambian `currentScreen` a `'home'`, los bindings internos del template
        — `payload.prompt`, `payload.options[correctIndex]`, etc. — se
        evalúan con `sessionCurrentExercise = null`, lo que provocaba
        TypeError. Añadir el check al `x-if` hace que el template no monte ni
        evalúe sus bindings cuando no hay ejercicio actual. Mismo patrón que
        Phase 1 usó con `<template x-if="ready && !done">` (UAT 01-02).
      -->
      <template x-if="currentScreen === 'session' && sessionCurrentExercise">
        <article @keydown.window="handleSessionKey($event)">
          <!-- SESSION-04: indicador "Ejercicio X / N" visible toda la sesión. -->
          <header x-text="sessionProgressLabel"></header>

          <p x-text="sessionCurrentExercise.payload.prompt"></p>

          <!--
            Sub-template MULTIPLE-CHOICE (Phase 1 + 2 — sin cambios funcionales
            respecto a 02-04, solo anidado bajo `x-if="...type === 'multiple-choice'"`
            para no entremezclarse con los sub-templates de los otros tipos).
          -->
          <template x-if="sessionCurrentExercise.type === 'multiple-choice'">
            <div>
              <div class="button-row">
                <template x-for="(opt, idx) in sessionCurrentExercise.payload.options" :key="idx">
                  <button type="button"
                          @click="sessionSelectOption(idx)"
                          :disabled="sessionFeedback !== null"
                          :class="{
                            'correcta': sessionFeedback !== null && idx === sessionCurrentExercise.payload.correctIndex,
                            'incorrecta': sessionFeedback === 'incorrect' && idx === sessionSelectedIndex
                          }"
                          x-text="opt"></button>
                </template>
              </div>

              <!-- Solo en respuesta incorrecta: muestra la correcta + botón Siguiente. -->
              <p x-show="sessionFeedback === 'incorrect'">
                Respuesta correcta:
                <strong x-text="sessionCurrentExercise.payload.options[sessionCurrentExercise.payload.correctIndex]"></strong>
              </p>
              <button x-show="sessionFeedback === 'incorrect'" @click="sessionAdvance">Siguiente</button>
            </div>
          </template>

          <!--
            Sub-template WORD-BUTTONS (Phase 3 plan 01; D-56/D-58/D-59/D-69).

            Layout vertical: banco arriba → área respuesta abajo → frase
            correcta (solo en fallo) → button-row con Comprobar/Siguiente.

            `.button-row` (NO role="group" — UAT 02-03/02-04 lesson recurrente)
            para que Comprobar y Siguiente se rendericen con gap visible.

            `x-text` exclusivamente para escapado seguro (T-02-01 invariante;
            ningún binding del JSON cruza por la directiva contraria que
            inyectaría markup sin escapar).
          -->
          <template x-if="sessionCurrentExercise.type === 'word-buttons'">
            <div>
              <!-- D-56 banco: botones con palabras + sufijo numérico ¹..⁹ (D-69). -->
              <div class="wb-bank">
                <template x-for="(entry, idx) in bankWithKeys" :key="entry.word + '_' + idx">
                  <button type="button"
                          @click="wordButtonsAddWord(idx)"
                          :disabled="sessionFeedback !== null"
                          :aria-label="'Palabra ' + entry.key + ': ' + entry.word">
                    <span x-text="entry.word"></span><sup class="kbd-hint" x-text="entry.key"></sup>
                  </button>
                </template>
              </div>

              <!-- D-56 área respuesta + D-58 placeholder italic (::before en CSS). -->
              <div class="wb-answer"
                   :class="{
                     'wb-answer-empty': wordButtonsAnswer.length === 0 && sessionFeedback === null,
                     'incorrecta': sessionFeedback === 'incorrect'
                   }"
                   aria-live="polite">
                <template x-for="(word, idx) in wordButtonsAnswer" :key="word + '_' + idx">
                  <button type="button"
                          @click="wordButtonsRemoveWord(idx)"
                          :disabled="sessionFeedback !== null"
                          x-text="word"></button>
                </template>
              </div>

              <!-- D-59 frase correcta literal al fallar. -->
              <p x-show="sessionFeedback === 'incorrect'" class="wb-correct-answer">
                Respuesta correcta:
                <strong x-text="sessionCurrentExercise.payload.answer.join(' ')"></strong>
              </p>

              <!-- D-58 botón Comprobar + Siguiente (mismo button-row pattern). -->
              <div class="button-row">
                <button type="button"
                        x-show="sessionFeedback === null"
                        @click="wordButtonsCheck"
                        :disabled="!wordButtonsCanCheck">Comprobar</button>
                <button type="button"
                        x-show="sessionFeedback === 'incorrect'"
                        @click="sessionAdvance">Siguiente</button>
              </div>
            </div>
          </template>

          <!--
            Sub-template MATCH (Phase 3 plan 02; D-60/D-61/D-63/D-66/D-70).

            Layout dos columnas (`.match-grid`, 1fr 1fr) con items botón
            verticales en cada columna. Sufijos visibles:
              - Columna izq: superíndice numérico ¹..⁹ (idx + 1, vacío si idx ≥ 9).
              - Columna der: superíndice alfabético ᵃ..ⁱ (`letterFor(idx)`).

            Estados visuales (UI-SPEC Estados visuales por componente — match):
              - `.match-selected` (izq): outline 2px azul Pico primary cuando
                el item izq está seleccionado y NO consumed.
              - `.match-consumed` (ambos): muted gris + opacity 0.55 +
                `:disabled` cuando la pareja ya fue formada correctamente.
              - `.match-flash` (ambos): animation `match-flash-red` 300ms única
                cuando el intento incorrecto involucra a este item.

            Double-defense Alpine: outer x-if `currentScreen === 'session' &&
            sessionCurrentExercise` ya guarda; `matchFlashIdx` se accede con
            null check explícito en el binding `:class`.

            x-text exclusivamente (T-02-01). `aria-label` con texto humano
            ("Sustantivo 1: casa", "Letra a: la") porque los lectores de
            pantalla NO leen superíndices Unicode de forma consistente.

            Botón Siguiente bajo el grid solo aparece tras fallo final
            (matchHadFailure + ejercicio completo). El flujo "match" muestra
            el botón Siguiente vía `sessionFeedback === 'incorrect'` cuando
            applyResultToSession se invoca con correct=false al cerrar el
            ejercicio con matchHadFailure=true. Mientras quedan parejas,
            sessionFeedback === null y los items siguen interactuables.
          -->
          <template x-if="sessionCurrentExercise.type === 'match'">
            <div>
              <div class="match-grid">
                <div class="match-col">
                  <template x-for="(item, idx) in matchLeft" :key="'L_' + idx + '_' + item">
                    <button type="button"
                            @click="matchSelectLeft(idx)"
                            :disabled="matchLeftIsConsumed(idx) || sessionFeedback !== null"
                            :class="{
                              'match-selected': matchSelectedLeftIdx === idx && !matchLeftIsConsumed(idx),
                              'match-consumed': matchLeftIsConsumed(idx),
                              'match-flash': matchFlashIdx && matchFlashIdx.left === idx
                            }"
                            :aria-label="'Sustantivo ' + (idx + 1) + ': ' + item">
                      <span x-text="item"></span><sup class="kbd-hint" x-text="idx < 9 ? (idx + 1) : ''"></sup>
                    </button>
                  </template>
                </div>
                <div class="match-col">
                  <template x-for="(item, idx) in matchRight" :key="'R_' + idx + '_' + item">
                    <button type="button"
                            @click="matchPickRight(idx)"
                            :disabled="matchRightIsConsumed(idx) || sessionFeedback !== null"
                            :class="{
                              'match-consumed': matchRightIsConsumed(idx),
                              'match-flash': matchFlashIdx && matchFlashIdx.right === idx
                            }"
                            :aria-label="'Letra ' + letterFor(idx) + ': ' + item">
                      <span x-text="item"></span><sup class="kbd-hint" x-text="letterFor(idx)"></sup>
                    </button>
                  </template>
                </div>
              </div>
              <button type="button"
                      x-show="sessionFeedback === 'incorrect'"
                      @click="sessionAdvance">Siguiente</button>
            </div>
          </template>

          <hr>
          <!--
            Phase 6 plan 01 (UX-01) — D-100/D-103. Botón "Reiniciar ejercicios"
            junto a "← Volver al home" en un `.button-row` (NO role="group" —
            lección recurrente UAT 02-03/02-04). Orden izquierda → derecha:
            "Reiniciar" (acción en contexto) → "Volver al home" (salir del
            contexto), análogo al banner in-flight `[Reanudar] [Descartar]`.

            Visibilidad: `x-show="sessionMode === 'repaso'"` (D-100) — oculto
            en Test completo. Doble defensa con el guard de `restartRepaso()`
            en src/screens/app.js: aunque el botón estuviera visible por bug,
            el handler hace early-return.

            Sin confirmación inline (D-102), sin animación post-reset (UI-SPEC
            §Visual cue tras el reset), sin atajo de teclado (UI-SPEC
            §Keyboard shortcut "sin atajo en v1" — saturación de teclas +
            colisión con Ctrl+R), sin disabled durante feedback (UI-SPEC
            §Disabled state: SIEMPRE clickable).
          -->
          <div class="button-row">
            <button type="button"
                    class="secondary"
                    x-show="sessionMode === 'repaso'"
                    @click="restartRepaso">Reiniciar ejercicios</button>
            <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
          </div>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla SUMMARY (D-37, SESSION-07 — Plan 02-04)                  -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Resumen factústico tras completar una sesión. Tono neutro (D-37):
        SIN emojis decorativos, SIN reformulaciones positivas, SIN botón
        "Repetir sesión". Sólo lista limpia de `categoría: antes → después`
        con flechas de color sutil (rojizo si regresión, verde si promoción).

        Guard `summaryDelta` (UAT round 1 Plan 02-03 lesson): el x-if NO
        monta el template hasta que `summaryDelta` esté poblado. Sin esto,
        el `x-for entry in summaryDelta` lanzaría TypeError sobre null
        durante el tick de unmount al cambiar `currentScreen` a 'home'.
      -->
      <template x-if="currentScreen === 'summary' && summaryDelta">
        <article>
          <header x-text="summaryHeaderLabel"></header>

          <ul class="summary-delta">
            <template x-for="entry in summaryDelta" :key="entry.categoryId">
              <li>
                <strong x-text="entry.categoryName"></strong>:
                <span x-text="entry.statusBefore"></span>
                <span class="delta-arrow"
                      :class="{ 'delta-regression': entry.isRegression, 'delta-promotion': entry.isPromotion }">→</span>
                <span x-text="entry.statusAfter"></span>
                <template x-if="entry.failed">
                  <span class="delta-reason" x-text="' · ' + entry.failureReason"></span>
                </template>
                <template x-if="entry.streakBefore !== entry.streakAfter">
                  <span class="delta-streak"
                        x-text="' · racha ' + entry.streakBefore + ' → ' + entry.streakAfter"></span>
                </template>
                <template x-if="entry.statusAfter === 'no-hecha' && entry.pendingForHecha > 0">
                  <span class="delta-pending"
                        x-text="' · ' + entry.pendingForHecha + ' ejercicios para volver a hecha'"></span>
                </template>
              </li>
            </template>
          </ul>

          <!--
            Phase 6 plan 02 (UX-02) — D-108/D-109/D-110.

            Sección "Errores cometidos": lista plana cronológica de los
            ejercicios fallados de esta sesión, cada fila multi-línea con
            prompt + Tu respuesta (rojo) + Respuesta correcta (semibold sin
            color verde — UI-SPEC §Color "<strong> sin clase verde").

            Guard x-if `sessionResults.some(r => !r.correct)` (D-108): si la
            sesión termina con 0 fallos, la sección no se renderiza en
            absoluto (sin mensaje "sin errores", sin emoji — la ausencia es
            la señal). Aplica a Repaso 20 + Test completo (D-110 hereda el
            shape extendido vía spread en persistInFlightTest, sin cambios
            al helper).

            Dispatch por ex.type con tres sub-templates (multi-choice /
            word-buttons / match), mismo patrón heredado de Phase 3 que el
            sub-template de session (líneas 259/296/375).

            T-02-01 invariante anti-XSS: TODO el contenido del JSON se
            renderiza vía `x-text` exclusivamente. Las etiquetas "Tu
            respuesta:" y "Respuesta correcta:" son strings HARDCODED en el
            HTML; el separador `↔` viene del template, NO del JSON.

            Match con userAnswer null (defensa adicional contra inFlightTest
            pre-Phase 6 reanudado tras migrate3to4 backfill): el x-if del
            sub-template match requiere `&& result.userAnswer` — si es null,
            la fila renderiza sólo el prompt sin las dos líneas Tu/Correcta
            (UI-SPEC §Copywriting "ausencia preferible al placeholder").
          -->
          <template x-if="sessionResults.some(r => !r.correct)">
            <section class="summary-errors">
              <h3>Errores cometidos</h3>
              <ul>
                <template x-for="result in sessionResults.filter(r => !r.correct)" :key="result.exerciseId">
                  <li>
                    <strong x-text="content.exerciseById[result.exerciseId].payload.prompt"></strong>

                    <template x-if="content.exerciseById[result.exerciseId].type === 'multiple-choice'">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="result.userAnswer"></span></div>
                        <div>Respuesta correcta: <strong x-text="content.exerciseById[result.exerciseId].payload.options[content.exerciseById[result.exerciseId].payload.correctIndex]"></strong></div>
                      </div>
                    </template>

                    <template x-if="content.exerciseById[result.exerciseId].type === 'word-buttons'">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="(result.userAnswer || []).join(' ')"></span></div>
                        <div>Respuesta correcta: <strong x-text="content.exerciseById[result.exerciseId].payload.answer.join(' ')"></strong></div>
                      </div>
                    </template>

                    <template x-if="content.exerciseById[result.exerciseId].type === 'match' && result.userAnswer">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="result.userAnswer.left + ' ↔ ' + result.userAnswer.right"></span></div>
                        <div>Respuesta correcta: <strong x-text="result.userAnswer.left + ' ↔ ' + (content.exerciseById[result.exerciseId].payload.pairs.find(p => p[0] === result.userAnswer.left)?.[1] || '(?)')"></strong></div>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
            </section>
          </template>

          <button type="button" @click="returnToHomeFromSummary">Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla BACKUP (D-83, D-84 — Phase 4)                            -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Pantalla 5ª del appShell (D-84, currentScreen === 'backup'). Layout:
          - Header "Backup".
          - Línea de estado (status) reactiva sobre state.lastBackupAt.
          - 2 botones: Exportar primario / Importar secundario (D-83).
          - Input file oculto, disparado vía $refs.backupFileInput.click().
          - Área de mensajes reactiva sobre backupLastMessage (clase verde/rojo).
          - "← Volver al home" reusa requestReturnToHome (D-82); limpia el
            mensaje al salir (W-2 fix en src/screens/app.js).

        Double-defense Alpine: el outer `x-if="currentScreen === 'backup'"`
        evita que los bindings internos (backupStatusLine, backupBannerText,
        exportBackup binding) se evalúen pre-init o cuando el usuario salió de
        la pantalla — los getters internos ya tienen `if (!this.state) return ''`
        como segundo nivel de defensa (mismo patrón que summary líneas 412-441).

        Mensaje area usa `x-show` (no x-if anidado) per UI-SPEC Implementation
        Notes línea 553-556: contenido simple sin bindings nested. Optional
        chaining `backupLastMessage?.X` porque x-show mantiene el DOM montado.
      -->
      <template x-if="currentScreen === 'backup'">
        <article>
          <header><h2>Backup</h2></header>

          <p class="picker-warning" x-text="backupStatusLine"></p>

          <div class="button-row">
            <button type="button" @click="exportBackup">Exportar progreso</button>
            <button type="button" class="secondary" @click="$refs.backupFileInput.click()">Importar progreso</button>
          </div>

          <input type="file"
                 x-ref="backupFileInput"
                 accept=".json,application/json"
                 @change="onFileSelected($event)"
                 style="display: none">

          <p x-show="backupLastMessage"
             :class="backupLastMessage?.kind === 'success' ? 'backup-message-success' : 'backup-message-error'"
             x-text="backupLastMessage?.text"></p>

          <hr>
          <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Confirmación inline reusable (D-27, D-43, D-44, D-76 Phase 4)    -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <div x-show="confirmDialog"
           x-cloak
           role="alertdialog"
           aria-labelledby="confirm-message"
           class="confirm-inline">
        <p id="confirm-message" x-text="confirmDialog?.message"></p>
        <!--
          Botones de confirmación (`Descartar` / `Continuar` o equivalentes).
          UAT 02-04 round 2: aplicamos `.button-row` preventivamente — el panel
          confirm aparece en D-27/D-43/D-44 con etiquetas distintas y los dos
          botones deben leerse como acciones separadas, no como un título. El
          margin override interior compacta el wrapper dentro del panel.
        -->
        <div class="button-row" style="margin: 0.5rem 0 0 0;">
          <button type="button"
                  @click="(() => { const cb = confirmDialog?.onConfirm; confirmDialog = null; if (cb) cb(); })()"
                  x-text="confirmDialog?.confirmLabel"></button>
          <button type="button"
                  class="secondary"
                  @click="(() => { const cb = confirmDialog?.onCancel; confirmDialog = null; if (cb) cb(); })()"
                  x-text="confirmDialog?.cancelLabel"></button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
