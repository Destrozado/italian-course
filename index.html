<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Phase 32 (D-03): paleta papel Editoriale siempre; modo oscuro desactivado. -->
  <meta name="color-scheme" content="light">
  <title>Italiano A1/A2 — Ejercicios</title>

  <!-- Pico CSS eliminado (Phase 32 / GAP-01): su tema claro stock pintaba una
       "card" blanca encima del papel y ganaba la cascada vía :root:not([data-theme=dark]).
       app.css aporta ahora el reset/base de elementos (Editoriale puro). -->

  <link rel="stylesheet" href="./styles.css">

  <!-- Capa "Editoriale" (Phase 32 · v1.8) — DESPUÉS de styles.css para ganar la
       cascada: reset/base de elementos, tokens --ed-*, @font-face auto-hospedadas,
       fondo papel, serif. -->
  <link rel="stylesheet" href="./app.css">

  <!--
    main.js se carga ANTES que Alpine para garantizar que su listener
    `alpine:init` quede registrado de forma síncrona en el top-level del
    módulo, ANTES de que Alpine emita el evento. Alpine luego carga (defer)
    y al arrancar emite `alpine:init` con nuestro listener ya en su sitio,
    listo para registrar el factory `appShell` justo antes del DOM scan.
  -->
  <script type="module" src="./src/main.js"></script>

  <!-- Alpine.js 3.15.12 — SRI pinned per RESEARCH.md 2026-05-23. -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
          integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
          crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <h1>Italiano A1/A2</h1>
    <!-- Banner de errores de validación (oculto por defecto; main.js lo rellena). -->
    <div id="error-banner" hidden></div>
    <!-- Placeholder mientras se carga el contenido. main.js lo remueve antes de
         que Alpine procese el árbol del componente. -->
    <div id="app-placeholder">Cargando…</div>

    <!--
      App shell Alpine (Plan 02-03).

      `x-cloak` evita FOUC mientras Alpine inicializa el componente.
      `x-init="init()"` dispara el await de `appDataReady` cuando el x-data monta.

      Cuatro pantallas mutuamente excluyentes vía `currentScreen` (D-24):
        1. home    — tabla densa de categorías + dos botones grandes.
        2. picker  — checkboxes compartidos entre Repaso y Test completo (D-33).
        3. session — multiple-choice migrada de Phase 1 con prefijo `session*` (D-25).
        4. summary — stub en Plan 02-03; poblado en Plan 02-04.

      Confirmación inline (D-27) renderizada al final del x-data root como un
      panel discreto reusable (Plan 02-04 lo reusará para D-43 y D-44).

      Seguridad (T-02-01): TODO el contenido del JSON se renderiza via `x-text`
      (textContent) — jamás la directiva contraria. Si un prompt contiene
      `<script>` o markup peligroso, se mostrará como texto literal.
    -->
    <div x-data="appShell" x-init="init()" x-cloak>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla HOME (D-24, D-29, D-30, D-32)                            -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <template x-if="currentScreen === 'home'">
        <article class="home-editorial">
          <!--
            HOME-01 — Cabecera editorial: motivo tricolore reutilizable (Plan 01),
            overline `ITALIANO · A1 / A2` (texto LITERAL, no de JSON) + título serif
            `Categorías` (Spectral 38/600). Markup-only, sin bindings nuevos.
          -->
          <header class="home-header">
            <span class="ed-tricolore" aria-hidden="true"></span>
            <p class="home-overline">ITALIANO · A1 / A2</p>
            <h2 class="home-title">Categorías</h2>
          </header>

          <!--
            Banner in-flight Test completo (D-43, Plan 02-04). Visible
            persistente mientras `state.inFlightTest` tenga ejercicios sin
            responder. Color amarillo sutil — alerta clara pero sin alarmismo.
            Orden vertical: banner → botones grandes → tabla (CONTEXT.md
            "orden vertical sugerido").

            UAT 02-04 round 1 fix (DOBLE DEFENSA — patrón canónico Plan 02-03):
            antes este bloque usaba `x-show="state.inFlightTest"` con bindings
            `state.inFlightTest?.cursor`. El `?.` NO protege el primer acceso a
            `.inFlightTest` cuando `state` mismo es `null` durante el boot (en
            el tick entre `Alpine.start()` y `init()` resolviendo `appDataReady`).
            Resultado: TypeError visible en consola tras cada recarga.

            Fix: outer `<template x-if="inFlightTestActive">` (getter defensivo
            en src/screens/app.js que devuelve `false` cuando `state` es null).
            El template gate evita que los bindings internos se evalúen hasta
            que el state esté cargado Y haya un inFlightTest con ejercicios
            pendientes. INSIDE the x-if, los bindings usan `inFlightTestProgress.X`
            con acceso DIRECTO (sin `?.`) — el getter garantiza que el subtree
            no se monta cuando el objeto es null.
          -->
          <template x-if="inFlightTestActive">
            <div role="alert" class="inflight-banner">
              ⚠ Tienes un Test completo a medias
              (<span x-text="inFlightTestProgress.cursor"></span>
              / <span x-text="inFlightTestProgress.total"></span> ejercicios).
              <!--
                `.button-row` en vez de `role="group"`: Pico's button group une
                los bordes (parecen un solo control). UAT 02-04 round 2 detectó
                el problema en el picker; aplicamos el mismo fix preventivo aquí
                en el banner para evitar redescubrirlo en una ronda futura.
                `margin-top` inline en lugar del `margin: 1.5rem 0` por defecto
                de `.button-row` — el banner es compacto y el wrapper exterior
                ya tiene padding.
              -->
              <div class="button-row" style="margin: 0.5rem 0 0 0;">
                <button type="button" @click="resumeInFlightTest">Reanudar</button>
                <button type="button" class="secondary" @click="discardInFlightTestWithConfirm">Descartar</button>
              </div>
            </div>
          </template>

          <!--
            Banner backup (D-80, Phase 4). Mismo patrón visual que .inflight-banner:
            <template x-if> con outer-gate getter null-safe (shouldShowBackupBanner
            devuelve false si state aún no cargó), role="alert", border ámbar.
            Aparece automáticamente cuando han pasado >7 días desde lastBackupAt
            (o desde firstUsedAt si lastBackupAt es null per D-78); desaparece
            al exportar (Alpine reactivity sobre state.lastBackupAt).
            Sin snooze ni dismiss — el sistema te obliga (filosofía Phase 1).
          -->
          <template x-if="shouldShowBackupBanner">
            <div role="alert" class="backup-banner">
              ⚠ <span x-text="backupBannerText"></span>
              <button type="button" class="secondary" @click="currentScreen = 'backup'">Ir a Backup</button>
            </div>
          </template>

          <!--
            HOME-02 — CTA primario "Repaso 20" (D-04/D-05). Ancho completo, verde,
            título + subtítulo + flecha + sombra verde (estilado en app.css).
            COMPORTAMIENTO INTACTO (D-05): @click="openPicker('repaso')" VERBATIM —
            abre el picker de selección de categorías, NO un lanzamiento directo.
            El subtítulo es decorativo; se usa "Repaso rápido" (neutro) para no
            prometer un lanzamiento de 20 directo que choque con el paso del picker.
          -->
          <button type="button" class="home-cta" @click="openPicker('repaso')">
            <span class="home-cta-text">
              <span class="home-cta-title">Repaso 20</span>
              <span class="home-cta-sub">Repaso rápido</span>
            </span>
            <span class="home-cta-arrow" aria-hidden="true">→</span>
          </button>

          <!--
            HOME-03 — Fila ghost de 3 (D-04): Test completo · Canciones · Backup.
            Todos los @click VERBATIM del diseño anterior. Canciones BAJA de
            protagonista a ghost (D-04, supersede del D-01 de Phase 13). Bordes
            border-soft, equiespaciados (flex:1), estilado en app.css.
          -->
          <div class="home-ghost-row">
            <button type="button" class="home-ghost" @click="openPicker('test-completo')">Test completo</button>
            <button type="button" class="home-ghost" @click="currentScreen = 'canciones'">Canciones</button>
            <button type="button" class="home-ghost" @click="currentScreen = 'backup'">Backup</button>
          </div>

          <!--
            HOME-05 — Fila de sección + switch Contrarreloj. Overline `CATEGORÍAS`
            a la izquierda; label `Contrarreloj` + switch a la derecha. El switch
            conserva su binding homeExamTimed VERBATIM (quick-260615-r3b, runtime-only):
            el examen de 1 clic de la tabla arranca cronometrado cuando está on.
          -->
          <div class="home-section-row">
            <p class="home-overline home-section-overline">CATEGORÍAS</p>
            <label class="home-exam-timed">
              Contrarreloj
              <input type="checkbox" role="switch" x-model="homeExamTimed">
            </label>
          </div>

          <!--
            HOME-04/06 — Tabla de categorías. Se CONSERVA el <figure><table> +
            x-for + los data-label (la capa móvil Phase-28 depende de ellos). En
            móvil cae a tarjetas (styles.css @media 640px); en desktop se restila
            a tabla editorial papel/serif/hairlines (app.css >=641px). Columna
            "Última vez" se mantiene en el DOM con su data-label (capa móvil) y se
            OCULTA en desktop por CSS → contrato 5 columnas (Estado · Categoría ·
            Racha · Ejercicios · Examen). Anti-XSS: TODO contenido via x-text.
          -->
          <figure>
            <table>
              <thead>
                <tr>
                  <th scope="col">Estado</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Racha</th>
                  <th scope="col">Ejercicios</th>
                  <th scope="col" class="col-ultima-vez">Última vez</th>
                  <th scope="col">Examen</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="cat in categoriesForDisplay" :key="cat.id">
                  <tr>
                    <td data-label="Estado">
                      <!-- Dot de estado (D-01): el color lo da la clase badge-* (Plan 01). -->
                      <span class="status-dot"
                            :class="`badge-${cat.status}`"
                            :aria-label="cat.statusLabel"></span>
                    </td>
                    <td>
                      <!--
                        D-02: nombre serif = parte antes de `(`; subtítulo "tema"
                        en cursiva = texto dentro del paréntesis. Derivado en
                        expresión Alpine sobre x-text (anti-XSS, NUNCA x-html).
                        Las categorías sin paréntesis no muestran subtítulo.
                      -->
                      <span class="cat-name" x-text="cat.name.split('(')[0].trim()"></span>
                      <span class="cat-topic"
                            x-show="cat.name.includes('(')"
                            x-text="cat.name.includes('(') ? cat.name.slice(cat.name.indexOf('(') + 1, cat.name.lastIndexOf(')')).trim() : ''"></span>
                    </td>
                    <td data-label="Racha">
                      <div class="streak-block">
                        <!--
                          Barra streak/21 (HOME-04): ancho de relleno = streakDays/21
                          (cap 100%), color verde (dominada) / ámbar (hecha) via la
                          clase badge-*. Estilo inline SOLO para el ancho dinámico.
                        -->
                        <span class="streak-bar" :class="`badge-${cat.status}`">
                          <span class="streak-bar-fill"
                                :style="`width: ${Math.min(cat.streakDays / 21 * 100, 100)}%`"></span>
                        </span>
                        <span class="streak-label" x-text="cat.streakLabel"></span>
                      </div>
                      <small x-show="cat.vecesFallada > 0"
                             x-text="`fallada x${cat.vecesFallada}`"></small>
                    </td>
                    <td data-label="Ejercicios" x-text="cat.totalCount"></td>
                    <td data-label="Última vez" class="col-ultima-vez" x-text="cat.lastPracticedLabel"></td>
                    <td data-label="Examen">
                      <button type="button"
                              class="examen-pill"
                              :disabled="!cat.examenEnabled"
                              :title="cat.examenTooltip"
                              @click="startExamen(cat.id)">Examen</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </figure>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla CANCIONES — listado (Phase 13, SONG-01/02/03/04)         -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Bloque SEPARADO de la tabla de categorías (D-01 milestone): las
        canciones NO son filas de esa tabla y NO entran en el sampler (LINK-04).
        Listado x-for espejo de la tabla de categorías: badge de estado
        (no-hecha/pasada/fallada — D-02), nº de frases (SONG-02) y botón "Jugar"
        de 1 clic (SONG-03). El status viene de `songProgress` persistido (SONG-04).

        Double-defense Alpine: el getter `songsForDisplay` guarda `if (!this.content)`
        y el outer `x-if` evita que los bindings se evalúen pre-init.

        T-02-01 anti-XSS: el title de la canción se renderiza con `x-text`; el
        glyph del badge es texto LITERAL en el HTML (fijo, NO viene del JSON).
      -->
      <template x-if="currentScreen === 'canciones'">
        <article>
          <header><h2>Canciones</h2></header>

          <figure>
            <table>
              <thead>
                <tr>
                  <th scope="col">Estado</th>
                  <th scope="col">Canción</th>
                  <th scope="col">Frases</th>
                  <th scope="col">Jugar</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="song in songsForDisplay" :key="song.id">
                  <tr>
                    <td data-label="Estado">
                      <span :class="`badge-${song.status}`"
                            :aria-label="song.statusLabel"></span>
                      <span x-text="song.statusLabel"></span>
                    </td>
                    <td>
                      <span x-text="song.title"></span>
                      <small x-show="song.vecesFallada > 0"
                             x-text="`fallada x${song.vecesFallada}`"></small>
                    </td>
                    <td data-label="Frases" x-text="song.phraseCount"></td>
                    <td data-label="Jugar">
                      <button type="button"
                              @click="startSong(song.id)">Jugar</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </figure>

          <hr>
          <button type="button" class="secondary" @click="currentScreen = 'home'">← Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla PICKER (D-24, D-33, D-34, D-35, D-36)                    -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <template x-if="currentScreen === 'picker'">
        <article>
          <header>
            <h2 x-text="pickerHeaderLabel"></h2>
          </header>

          <!--
            Botones de selección masiva. UAT 02-04 round 2: con `role="group"`
            los dos botones se veían "pegados, no parecen dos botones, parecen
            un título" — mismo root cause que en la home (UAT 02-03). Fix:
            `.button-row` (gap visible + flex layout). Misma clase reusable
            que el home y el banner in-flight.
          -->
          <div class="button-row">
            <button type="button" class="secondary" @click="pickerSelectAll">Seleccionar todo</button>
            <button type="button" class="secondary" @click="pickerClearAll">Quitar todo</button>
          </div>

          <!-- Checkboxes por categoría (D-34: vacíos al entrar). -->
          <fieldset>
            <template x-for="cat in content.categories" :key="cat.id">
              <label>
                <input type="checkbox"
                       :value="cat.id"
                       :checked="pickerCheckedCategoryIds.includes(cat.id)"
                       @change="pickerToggleCategory(cat.id)">
                <span x-text="cat.name"></span>
              </label>
            </template>
          </fieldset>

          <!-- quick-260615-puq (feature todo #4): modo contrarreloj OPCIONAL.
               Aplica a repaso Y test-completo (mismo picker vía pickerMode).
               Desmarcado al abrir (openPicker resetea pickerTimed). -->
          <label class="picker-timed">
            <input type="checkbox" x-model="pickerTimed">
            <span>Contrarreloj <small>(tiempo por respuesta)</small></span>
          </label>

          <!-- Botón Empezar con label dinámico (D-35). -->
          <button type="button"
                  @click="startSession"
                  :disabled="pickerPoolSize === 0"
                  x-text="pickerStartLabel"></button>

          <!-- Aviso inline para Test completo (D-36) — texto plano en español. -->
          <p x-show="pickerMode === 'test-completo' && pickerPoolSize > 0" class="picker-warning">
            ⚠ Test completo — <span x-text="pickerPoolSize"></span> ejercicios sin tope. Se puede reanudar si lo cierras a medias.
          </p>

          <hr>
          <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla SESSION (D-24, D-25 — migrado íntegro de Phase 1)        -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Guard `&& sessionCurrentExercise` (UAT 02-03 finding 2 — segundo nivel
        de defensa, complementa el getter defensivo). Alpine reevalúa los
        bindings de un x-if UNA VEZ con el state nuevo antes de desmontarlo
        (tick de unmount). Cuando `completeSession()` o el modal de descartar
        cambian `currentScreen` a `'home'`, los bindings internos del template
        — `payload.prompt`, `payload.options[correctIndex]`, etc. — se
        evalúan con `sessionCurrentExercise = null`, lo que provocaba
        TypeError. Añadir el check al `x-if` hace que el template no monte ni
        evalúe sus bindings cuando no hay ejercicio actual. Mismo patrón que
        Phase 1 usó con `<template x-if="ready && !done">` (UAT 01-02).
      -->
      <template x-if="currentScreen === 'session' && sessionCurrentExercise">
        <article class="session" @keydown.window="handleSessionKey($event)">
          <!--
            Phase 33 (EX-01) — Barra superior Editoriale: botón atrás circular
            (‹), barra de progreso verde (% del set), contador NN/NN (Space
            Grotesk) y chip de cronómetro cuando Contrarreloj está activo.
            TODOS los bindings se conservan; estética cambia, lógica no.
          -->
          <div class="session-topbar">
            <!-- D-10 + accesibilidad: botón icon-only ‹ con aria-label estático.
                 Llama al EXISTENTE requestReturnToHome (confirmación intacta). -->
            <button type="button"
                    class="session-back"
                    @click="requestReturnToHome"
                    aria-label="Volver al home">‹</button>

            <!-- Barra de progreso verde: ancho = sessionProgressPercent (getter
                 nuevo read-only). Pista faint + relleno verde. -->
            <div class="session-progress" aria-hidden="true">
              <span class="session-progress-fill"
                    :style="'width:' + sessionProgressPercent + '%'"></span>
            </div>

            <!-- Contador NN/NN (Space Grotesk). -->
            <span class="session-counter" x-text="sessionProgressCounter"></span>

            <!-- quick-260615-puq (feature todo #4): cronómetro de respuesta.
                 Visible SOLO mientras corre el tiempo (sessionTimed && sin
                 feedback aún). D-11: chip de segundos restantes + barra que se
                 vacía (refuerzo). La mecánica vive en app.js; aquí solo lectura
                 de sessionTimeRemainingMs (reactivo). Las expresiones del timer
                 (x-show, :max, :value, x-text de segundos) van VERBATIM — solo
                 se envuelven/clasan para el chip Editoriale. -->
            <div class="session-timer" x-show="sessionTimed && sessionFeedback === null">
              <progress class="session-timer-bar"
                        :max="sessionTimeLimitMs(sessionCurrentExercise)"
                        :value="sessionTimeRemainingMs"></progress>
              <span class="session-timer-secs session-timer-chip"
                    x-text="Math.ceil(sessionTimeRemainingMs / 1000) + 's'"></span>
            </div>
          </div>

          <!-- 260615-hhp: título de ubicación/contexto (dónde estás), repintado
               como overline Editoriale (UPPERCASE vía CSS, D-06). -->
          <h2 class="session-context" x-text="sessionContextLabel"></h2>
          <!-- SESSION-04: indicador "Ejercicio X / N" conservado como texto
               accesible; el contador visible NN/NN vive en la barra superior. -->
          <header class="session-progress-sr" x-text="sessionProgressLabel"></header>

          <!--
            Phase 33 (EX-02 / D-08) — Prompt serif 30 con el hueco `___`
            renderizado como slot inline estilizado. Trocea sessionPromptParts
            (getter nuevo read-only) e intercala un <span> de hueco entre las
            dos partes. Pre-corrección: hueco vacío subrayado. Post-corrección:
            se rellena con la respuesta correcta — subrayado verde si acertó
            (sessionFeedback === 'correct'), tachado rojo si falló. El texto del
            hueco fluye por x-text (T-02-01 anti-XSS), nunca HTML crudo.
          -->
          <p class="session-prompt">
            <template x-for="(part, idx) in sessionPromptParts" :key="idx">
              <span>
                <span x-text="part"></span>
                <!-- Hueco entre partes: solo si hay una parte siguiente (un único
                     ___ por prompt → un solo slot tras la primera parte). -->
                <span x-show="idx < sessionPromptParts.length - 1"
                      class="session-gap"
                      :class="{
                        'gap-correct': sessionFeedback === 'correct',
                        'gap-wrong': sessionFeedback === 'incorrect'
                      }"
                      x-text="sessionFeedback !== null ? (sessionCurrentExercise.payload.options?.[sessionCurrentExercise.payload.correctIndex] ?? '') : ''"></span>
              </span>
            </template>
          </p>

          <!--
            Sub-template MULTIPLE-CHOICE (Phase 1 + 2 — sin cambios funcionales
            respecto a 02-04, solo anidado bajo `x-if="...type === 'multiple-choice'"`
            para no entremezclarse con los sub-templates de los otros tipos).
          -->
          <template x-if="sessionCurrentExercise.type === 'multiple-choice'">
            <div>
              <!--
                Phase quick-260525-pwq (D-181) — shuffle visual via indirección.
                Iteramos `multiChoiceOrder` (permutación de índices ORIGINALES);
                cada `perm` apunta al índice canónico del JSON. El texto, el
                click y las clases usan `perm` para resolver desde el JSON
                inmutable (D-132). `sessionSelectOption(perm)` recibe el índice
                ORIGINAL → `multipleChoice.grade` opera sobre `correctIndex`
                canónico sin cambios (cero diff en multiple-choice.js).
                `:key="perm"` es estable entre re-renders del mismo ejercicio
                (perm es el índice del JSON, no la posición visual).
              -->
              <!--
                Phase 33 (EX-03 / D-01 / D-02) — Fila de opciones repintada al
                comprobado Editoriale SIN tocar el flujo de 1 PASO. El @click
                sigue siendo `sessionSelectOption(perm)` → corrige al instante
                (D-01: NO hay botón "Comprobar", NO hay estado de pre-selección
                verde, el teclado 1-4 corrige igual). Las clases `.correcta` /
                `.incorrecta` (ya toggladas por el motor) se repintan en app.css
                a tinte verde+✓ / tinte rojo+✗; el resto se atenúa a opacity 0.5.
                Los marcadores ✓/✗ son <span aria-hidden> hardcodeados (no datos)
                mostrados por la propia clase de estado → significado NO solo
                cromático (focus/disabled spec).
              -->
              <div class="button-row session-options">
                <template x-for="(perm, idx) in multiChoiceOrder" :key="perm">
                  <button type="button"
                          @click="sessionSelectOption(perm)"
                          :disabled="sessionFeedback !== null"
                          :class="{
                            'correcta': sessionFeedback !== null && perm === sessionCurrentExercise.payload.correctIndex,
                            'incorrecta': sessionFeedback === 'incorrect' && perm === sessionSelectedIndex
                          }"
                          x-text="sessionCurrentExercise.payload.options[perm]"></button>
                </template>
              </div>

              <!--
                Phase 33 (EX-03 / D-09) — Caja de feedback tintada con título

              <div x-show="sessionFeedback !== null"

                     'correct': sessionFeedback === 'correct',

                <!-- Títulos italianos hardcodeados (D-09, T-02-01: nunca x-text). -->

                <p x-show="(sessionFeedback === 'incorrect' || (sessionFeedback === 'correct' && sessionExplanationRevealed)) && sessionCurrentExercise.payload.explanation"

                <button type="button"

              <!--
                Phase 33 (EX-03 / D-04) — CTA inferior primaria "Continuar →"

                `sessionAdvance` sin cambios. Sin auto-avance (600ms = solo modo

              <button type="button"

                      x-show="sessionFeedback !== null"
                      @click="sessionAdvance">Continuar →</button>
            </div>
          </template>

          <!--
            Sub-template WORD-BUTTONS (Phase 3 plan 01; D-56/D-58/D-59/D-69).

            Phase 33 (EX-05 / D-12 / D-08 / D-09) — Repaint al lenguaje
            Editoriale, EXTRAPOLADO consistente con opción múltiple (33-02), SOBRE
            la mecánica intacta de armar-y-comprobar. EX-05 no está en el handoff
            (D-12): el banco son píldoras sobre --ed-surface con borde
            --ed-border-soft (radio 12), los huecos colocados se quedan como
            placeholders invisibles (sin reflow), el área respuesta rellena
            verde-subrayado (acierto) / rojo-tachado (fallo) post-corrección

            El MODELO NATIVO armar-y-comprobar se PRESERVA: Comprobar (deshabilitado
            hasta wordButtonsCanCheck) → Siguiente. NO es el 1-paso de MC; aquí el
            usuario genuinamente construye la frase y luego comprueba.

            `x-text` exclusivamente para escapado seguro (T-02-01 invariante;

            inyectaría markup sin escapar). Títulos y labels HARDCODEADOS.
          -->
          <template x-if="sessionCurrentExercise.type === 'word-buttons'">
            <div>
              <!-- D-56 banco: píldoras Editoriale con palabras + sufijo ¹..⁹ (D-69). -->
              <div class="wb-bank">
                <template x-for="(entry, idx) in bankWithKeys" :key="entry.idx">
                  <button type="button"
                          @click="wordButtonsAddWord(entry.idx)"

                          :disabled="sessionFeedback !== null || entry.placed"
                          :tabindex="entry.placed ? -1 : 0"
                          :aria-hidden="entry.placed"
                          :aria-label="'Palabra ' + entry.key + ': ' + entry.word">

                  </button>
                </template>
              </div>

              <!--
                D-56 área respuesta + D-58 placeholder italic (::before en CSS).
                Phase 33 (D-08): post-corrección el área completa se presenta como

                rojo-tachado al fallar (.incorrecta) — coherente con el gap-fill

                se añade `correcta` para el estado verde post-corrección.
              -->
              <div class="wb-answer"
                   :class="{
                     'wb-answer-empty': wordButtonsAnswer.length === 0 && sessionFeedback === null,
                     'correcta': sessionFeedback === 'correct',
                     'incorrecta': sessionFeedback === 'incorrect'
                   }"
                   aria-live="polite">
                <template x-for="(word, idx) in wordButtonsAnswer" :key="idx">
                  <button type="button"
                          @click="wordButtonsRemoveWord(idx)"
                          :disabled="sessionFeedback !== null"
                          x-text="word"></button>
                </template>
              </div>

              <!--
                Phase 33 (EX-05 / D-09) — Caja de feedback tintada con título
                serif italiano (¡Esatto! / Quasi…, HARDCODEADOS, NO x-text) + la
                frase correcta al fallar (D-59 plegada, copy español) + la
                explicación pedagógica existente + el affordance "¿Por qué?".
                `.session-feedback` (+ .correct/.wrong) viene del scaffold 33-01,

              -->
              <div x-show="sessionFeedback !== null"
                   class="session-feedback"
                   :class="{
                     'correct': sessionFeedback === 'correct',
                     'wrong': sessionFeedback === 'incorrect'
                   }">
                <!-- Títulos italianos hardcodeados (D-09, T-02-01: nunca x-text). -->
                <p class="session-feedback-title" x-show="sessionFeedback === 'correct'">¡Esatto!</p>
                <p class="session-feedback-title" x-show="sessionFeedback === 'incorrect'">Quasi…</p>

                <!-- D-59 plegada: frase correcta literal al fallar (copy español, dato vía x-text). -->
                <p class="session-feedback-correct" x-show="sessionFeedback === 'incorrect'">
                  Respuesta correcta:
                  <strong x-text="sessionCurrentExercise.payload.answer.join(' ')"></strong>
                </p>
                <!--
                  Phase 7 plan 01 (D-118, EXPL-02) — Explicación pedagógica
                  inline (ver comentario homólogo en sub-template multi-choice).
                  Doble guard + `x-text` exclusivo + clase compartida con

                <p x-show="(sessionFeedback === 'incorrect' || (sessionFeedback === 'correct' && sessionExplanationRevealed)) && sessionCurrentExercise.payload.explanation"

                <button type="button"

                        class="session-cta"
                        x-show="sessionFeedback !== null"

            </div>
          </template>

          <!--
            Sub-template MATCH (Phase 3 plan 02; D-60/D-61/D-63/D-66/D-70).

            Layout dos columnas (`.match-grid`, 1fr 1fr) con items botón
            verticales en cada columna. Sufijos visibles:
              - Columna izq: superíndice numérico ¹..⁹ (idx + 1, vacío si idx ≥ 9).
              - Columna der: superíndice alfabético ᵃ..ⁱ (`letterFor(idx)`).

            Estados visuales (UI-SPEC Estados visuales por componente — match):
              - `.match-selected` (izq): outline 2px azul Pico primary cuando
                el item izq está seleccionado y NO consumed.
              - `.match-consumed` (ambos): muted gris + opacity 0.55 +
                `:disabled` cuando la pareja ya fue formada correctamente.
              - `.match-flash` (ambos): animation `match-flash-red` 300ms única
                cuando el intento incorrecto involucra a este item.

            Double-defense Alpine: outer x-if `currentScreen === 'session' &&
            sessionCurrentExercise` ya guarda; `matchFlashIdx` se accede con
            null check explícito en el binding `:class`.

            x-text exclusivamente (T-02-01). `aria-label` con texto humano
            ("Sustantivo 1: casa", "Letra a: la") porque los lectores de
            pantalla NO leen superíndices Unicode de forma consistente.

            Botón Siguiente bajo el grid solo aparece tras fallo final
            (matchHadFailure + ejercicio completo). El flujo "match" muestra
            el botón Siguiente vía `sessionFeedback === 'incorrect'` cuando
            applyResultToSession se invoca con correct=false al cerrar el
            ejercicio con matchHadFailure=true. Mientras quedan parejas,
            sessionFeedback === null y los items siguen interactuables.
          -->
          <template x-if="sessionCurrentExercise.type === 'match'">
            <div>
              <div class="match-grid">
                <div class="match-col">
                  <template x-for="(item, idx) in matchLeft" :key="'L_' + idx + '_' + item">
                    <button type="button"
                            @click="matchSelectLeft(idx)"
                            :disabled="matchLeftIsConsumed(idx) || sessionFeedback !== null"
                            :class="{
                              'match-selected': matchSelectedLeftIdx === idx && !matchLeftIsConsumed(idx),
                              'match-consumed': matchLeftIsConsumed(idx),
                              'match-flash': matchFlashIdx && matchFlashIdx.left === idx
                            }"
                            :aria-label="'Sustantivo ' + (idx + 1) + ': ' + item">
                      <!--
                        Phase 33 (EX-04 / D-05) — badge numérico por pareja
                        emparejada: círculo verde + número blanco (CSS), reemplaza
                        el sufijo ¹..⁹. El número deriva de `pairIdx + 1` del par
                        consumido cuyo `leftIdx` coincide (mismo número que el
                        gemelo de la columna derecha). x-text SOLO sobre el número
                        derivado (T-33-07: nunca x-html). Pre-emparejado conserva
                        el sufijo ¹..⁹ (.kbd-hint, oculto al consumir vía CSS).
                      -->
                      <span x-text="item"></span><sup class="kbd-hint" x-text="idx < 9 ? (idx + 1) : ''"></sup>
                      <span class="match-badge"
                            x-show="matchLeftIsConsumed(idx)"
                            x-text="(matchPairsConsumed.find(p => p.leftIdx === idx)?.pairIdx ?? idx) + 1"></span>
                    </button>
                  </template>
                </div>
                <div class="match-col">
                  <template x-for="(item, idx) in matchRight" :key="'R_' + idx + '_' + item">
                    <button type="button"
                            @click="matchPickRight(idx)"
                            :disabled="matchRightIsConsumed(idx) || sessionFeedback !== null"
                            :class="{
                              'match-consumed': matchRightIsConsumed(idx),
                              'match-flash': matchFlashIdx && matchFlashIdx.right === idx
                            }"
                            :aria-label="'Letra ' + letterFor(idx) + ': ' + item">
                      <span x-text="item"></span><sup class="kbd-hint" x-text="letterFor(idx)"></sup>
                      <span class="match-badge"
                            x-show="matchRightIsConsumed(idx)"
                            x-text="(matchPairsConsumed.find(p => p.rightIdx === idx)?.pairIdx ?? idx) + 1"></span>
                    </button>
                  </template>
                </div>
              </div>
              <!--
                Phase 33 (EX-04, UI-SPEC §Match) — nota opcional "N de M
                emparejadas": derivación presentacional read-only de
                `matchPairsConsumed.length` / `matchLeft.length`. x-text SOLO
                sobre los números derivados (T-33-07). Oculta cuando no hay
                ninguna emparejada o ya está completo / en feedback final.
              -->
              <p class="match-note"
                 x-show="sessionFeedback === null && matchPairsConsumed.length > 0 && matchPairsConsumed.length < matchLeft.length"
                 aria-live="polite">
                <span x-text="matchPairsConsumed.length"></span> de <span x-text="matchLeft.length"></span> emparejadas
              </p>
              <!--
                Phase 7 plan 01 (D-118, EXPL-02) — Explicación pedagógica
                inline durante feedback rojo. En match NO hay línea "Respuesta
                correcta:" (la captura visual del fallo es el match-flash rojo
                + el grid quedó incompleto), así que la explanation va entre
                el `</div>` que cierra `.match-grid` y el botón "Siguiente".
                Doble guard + `x-text` exclusivo + clase compartida.
              -->
              <!--
                Phase 33 (EX-04 / D-09) — Caja de feedback compartida (scaffold
                33-01, idéntica al patrón de multiple-choice/word-buttons 33-02/03).
                En match NO hay caja de "acierto" mid-flow (cada pareja se valida
                al vuelo); la caja aparece solo en el feedback FINAL. Como el match
                solo cierra con feedback tras un fallo (matchHadFailure → correct=
                false), el título es el serif "Quasi…" HARDCODEADO (D-09, T-33-07:
                nunca x-text). En el caso límite de acierto revelado ("¿Por qué?")
                la caja se muestra neutra sin título. La explicación pedagógica
                existente va dentro, vía x-text exclusivo.
              -->
              <div x-show="(sessionFeedback === 'incorrect' || (sessionFeedback === 'correct' && sessionExplanationRevealed)) && sessionCurrentExercise.payload.explanation"
                   class="session-feedback"
                   :class="{
                     'correct': sessionFeedback === 'correct',
                     'wrong': sessionFeedback === 'incorrect'
                   }">
                <p class="session-feedback-title" x-show="sessionFeedback === 'incorrect'">Quasi…</p>
                <p class="session-explanation"
                   x-text="sessionCurrentExercise.payload.explanation"></p>
              </div>
              <!-- quick-260615-hr0: affordance "¿Por qué?" al acertar con explanation. -->
              <button type="button"
                      class="session-why"
                      x-show="sessionFeedback === 'correct' && sessionCurrentExercise.payload.explanation && !sessionExplanationRevealed"
                      @click="revealSessionExplanation()">¿Por qué?</button>
              <button type="button"
                      class="session-cta"
                      x-show="sessionFeedback !== null"
                      @click="sessionAdvance">Siguiente</button>
            </div>
          </template>

          <hr>
          <!--
            Phase 6 plan 01 (UX-01) — D-100/D-103. Botón "Reiniciar ejercicios"
            junto a "← Volver al home" en un `.button-row` (NO role="group" —
            lección recurrente UAT 02-03/02-04). Orden izquierda → derecha:
            "Reiniciar" (acción en contexto) → "Volver al home" (salir del
            contexto), análogo al banner in-flight `[Reanudar] [Descartar]`.

            Visibilidad: `x-show="sessionMode === 'repaso' || sessionMode ===
            'test-completo'"` — Phase 6 D-100 (Repaso) extendido Phase 8.y
            (quick 260525-vvj) para incluir también modo Examen (test-completo).
            Doble defensa con el guard dual-mode de `restartRepaso()` en
            src/screens/app.js: aunque el botón estuviera visible por bug,
            el handler hace early-return en cualquier otro modo. El handler
            dispatcha internamente: rama Repaso → buildSession sin tocar
            localStorage (SESSION-08); rama Examen → buildFullTest([catId]) +
            persistInFlightTest (D-182 slot único). Texto del botón
            hardcoded — T-02-01 anti-XSS invariante (NO x-text dinámico).

            Sin confirmación inline (D-102), sin animación post-reset (UI-SPEC
            §Visual cue tras el reset), sin atajo de teclado (UI-SPEC
            §Keyboard shortcut "sin atajo en v1" — saturación de teclas +
            colisión con Ctrl+R), sin disabled durante feedback (UI-SPEC
            §Disabled state: SIEMPRE clickable).
          -->
          <div class="button-row">
            <button type="button"
                    class="secondary"
                    x-show="sessionMode === 'repaso' || sessionMode === 'test-completo'"
                    @click="restartRepaso">Reiniciar ejercicios</button>
            <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
          </div>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla CANCION — playthrough (Phase 13, PLAY-01/02/03/05)       -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Recorrido secuencial it->es de las frases de una canción. Copia el
        bloque word-buttons de la sesión (banco + área respuesta + frase
        correcta al fallar + Comprobar/Siguiente) pero resuelve la frase activa
        contra `songCurrentPhrase` (LINK-04: las frases NO están en
        exerciseById) y dispatcha al path de canción (songCheck/songAdvance).

        Double-defense Alpine: outer guard `currentScreen === 'cancion' &&
        songCurrentPhrase` — el getter ya devuelve null defensivamente; el x-if
        evita que los bindings se evalúen durante el tick de unmount.

        @keydown.window="handleSongKey($event)" (D-72): atajos word-buttons
        (1-9 banco, Backspace, Enter=Comprobar/avanzar). Auto-unmount al cambiar
        currentScreen.

        T-02-01 anti-XSS: la línea italiana (`payload.prompt`) y la respuesta
        correcta se renderizan EXCLUSIVAMENTE con `x-text` (NUNCA x-html).
      -->
      <template x-if="currentScreen === 'cancion' && songCurrentPhrase">
        <article @keydown.window="handleSongKey($event)">
          <!-- 260615-hhp: título de ubicación/contexto (dónde estás) ENCIMA del progreso. -->
          <h2 class="session-context" x-text="sessionContextLabel"></h2>
          <!-- PLAY-01: indicador "Frase X / N" visible todo el recorrido. -->
          <header x-text="songProgressLabel"></header>

          <!-- PLAY-02: la línea ITALIANA es el texto a traducir (x-text — T-02-01). -->
          <p x-text="songCurrentPhrase.payload.prompt"></p>

          <div>
            <!-- Banco de palabras españolas (con sufijo numérico ¹..⁹, D-69). -->
            <div class="wb-bank">
              <template x-for="(entry, idx) in bankWithKeys" :key="entry.idx">
                <button type="button"
                        @click="wordButtonsAddWord(entry.idx)"
                        :class="{ 'wb-placed': entry.placed }"
                        :disabled="sessionFeedback !== null || entry.placed"
                        :tabindex="entry.placed ? -1 : 0"
                        :aria-hidden="entry.placed"
                        :aria-label="'Palabra ' + entry.key + ': ' + entry.word">
                  <span x-text="entry.word"></span><sup class="kbd-hint" x-text="entry.key"></sup>
                </button>
              </template>
            </div>

            <!-- Área respuesta (tokens colocados). -->
            <div class="wb-answer"
                 :class="{
                   'wb-answer-empty': wordButtonsAnswer.length === 0 && sessionFeedback === null,
                   'incorrecta': sessionFeedback === 'incorrect'
                 }"
                 aria-live="polite">
              <template x-for="(word, idx) in wordButtonsAnswer" :key="idx">
                <button type="button"
                        @click="wordButtonsRemoveWord(idx)"
                        :disabled="sessionFeedback !== null"
                        x-text="word"></button>
              </template>
            </div>

            <!-- PLAY-03: frase correcta literal al fallar (x-text — T-02-01). -->
            <p x-show="sessionFeedback === 'incorrect'" class="wb-correct-answer">
              Respuesta correcta:
              <strong x-text="songCurrentPhrase.payload.answer.join(' ')"></strong>
            </p>

            <!-- Comprobar + Siguiente (path de canción: songCheck/songAdvance). -->
            <div class="button-row">
              <button type="button"
                      x-show="sessionFeedback === null"
                      @click="songCheck"
                      :disabled="!wordButtonsCanCheck">Comprobar</button>
              <button type="button"
                      x-show="sessionFeedback === 'incorrect'"
                      @click="songAdvance">Siguiente</button>
            </div>
          </div>

          <hr>
          <!--
            PLAY-05: abandonar a mitad descarta el progreso NO comprometido (los
            fallos ya cascadeados por D-54 quedan persistidos). Re-entrar empieza
            de cero. Directo a la lista (sin slot de reanudación).
          -->
          <button type="button" class="secondary" @click="returnToSongList">← Volver a Canciones</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla SUMMARY (D-37, SESSION-07 — Plan 02-04)                  -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Resumen factústico tras completar una sesión. Tono neutro (D-37):
        SIN emojis decorativos, SIN reformulaciones positivas, SIN botón
        "Repetir sesión". Sólo lista limpia de `categoría: antes → después`
        con flechas de color sutil (rojizo si regresión, verde si promoción).

        Guard `summaryDelta` (UAT round 1 Plan 02-03 lesson): el x-if NO
        monta el template hasta que `summaryDelta` esté poblado. Sin esto,
        el `x-for entry in summaryDelta` lanzaría TypeError sobre null
        durante el tick de unmount al cambiar `currentScreen` a 'home'.
      -->
      <template x-if="currentScreen === 'summary' && summaryDelta">
        <article>
          <!-- 260615-hhp: contexto de la sesión de la que viene (ENCIMA del header propio del summary, sin romperlo). -->
          <h2 class="session-context" x-text="sessionContextLabel"></h2>
          <header x-text="summaryHeaderLabel"></header>

          <ul class="summary-delta">
            <template x-for="entry in summaryDelta" :key="entry.categoryId">
              <li>
                <strong x-text="entry.categoryName"></strong>:
                <span x-text="entry.statusBefore"></span>
                <span class="delta-arrow"
                      :class="{ 'delta-regression': entry.isRegression, 'delta-promotion': entry.isPromotion }">→</span>
                <span x-text="entry.statusAfter"></span>
                <template x-if="entry.failed">
                  <span class="delta-reason" x-text="' · ' + entry.failureReason"></span>
                </template>
                <template x-if="entry.streakBefore !== entry.streakAfter">
                  <span class="delta-streak"
                        x-text="' · racha ' + entry.streakBefore + ' → ' + entry.streakAfter"></span>
                </template>
                <template x-if="entry.statusAfter === 'no-hecha' && entry.pendingForHecha > 0">
                  <span class="delta-pending"
                        x-text="' · ' + entry.pendingForHecha + ' ejercicios para volver a hecha'"></span>
                </template>
              </li>
            </template>
          </ul>

          <!--
            Phase 6 plan 02 (UX-02) — D-108/D-109/D-110.

            Sección "Errores cometidos": lista plana cronológica de los
            ejercicios fallados de esta sesión, cada fila multi-línea con
            prompt + Tu respuesta (rojo) + Respuesta correcta (semibold sin
            color verde — UI-SPEC §Color "<strong> sin clase verde").

            Guard x-if `sessionResults.some(r => !r.correct)` (D-108): si la
            sesión termina con 0 fallos, la sección no se renderiza en
            absoluto (sin mensaje "sin errores", sin emoji — la ausencia es
            la señal). Aplica a Repaso 20 + Test completo (D-110 hereda el
            shape extendido vía spread en persistInFlightTest, sin cambios
            al helper).

            Dispatch por ex.type con tres sub-templates (multi-choice /
            word-buttons / match), mismo patrón heredado de Phase 3 que el
            sub-template de session (líneas 259/296/375).

            T-02-01 invariante anti-XSS: TODO el contenido del JSON se
            renderiza vía `x-text` exclusivamente. Las etiquetas "Tu
            respuesta:" y "Respuesta correcta:" son strings HARDCODED en el
            HTML; el separador `↔` viene del template, NO del JSON.

            Match con userAnswer null (WR-04: el guard `&& result.userAnswer`
            del sub-template match cubre EXCLUSIVAMENTE entradas pre-Phase 6
            backfilleadas por `migrate3to4` — un test completo abandonado
            antes del bump 3→4 cuyas `inFlightTest.answers` recibieron
            `userAnswer: null` por backfill defensivo, reanudado tras la
            migración. Los matches CORRECTOS (que también tienen
            `userAnswer: null` por D-107 — `matchFirstWrongPair` nunca se
            seteó) NO llegan a este sub-template: el outer `filter(r =>
            !r.correct ...)` los excluye antes. Sin esta clarificación, el
            guard parecía defenderse de un caso imposible.

            Cuando el guard cae a falsy, la fila renderiza sólo el prompt
            sin las dos líneas Tu/Correcta (UI-SPEC §Copywriting "ausencia
            preferible al placeholder").
          -->
          <!-- CR-02 fix: leer del snapshot `summarySessionResults` (set en
               `completeSession()`, limpiado en `returnToHomeFromSummary()`),
               NO del live `sessionResults`. Esto blinda el render frente al
               tick de unmount cuando `returnToHomeFromSummary()` llama
               `resetSession()` antes de cambiar `currentScreen` a 'home' —
               mismo patrón de snapshot que `summaryDelta` (línea 462). -->
          <!-- Phase 16 (D-16-09): el review de errores resuelve la VARIANTE
               EXACTA fallada vía `summaryVariantSurface(result)` (slotById +
               result.variantIndex), no `content.exerciseById[...].payload`. El
               helper re-envuelve la superficie de la variante en `{type, payload}`
               (mismo synthetic-payload que sessionCurrentExercise), así la
               estructura visual y el copy quedan IDÉNTICOS (EXAM-02). El filter
               guarda contra slot ausente (`content.slotById[r.exerciseId]`). -->
          <template x-if="summarySessionResults.some(r => !r.correct && content.slotById[r.exerciseId])">
            <section class="summary-errors">
              <h3>Errores cometidos</h3>
              <ul>
                <!-- CR-01 fix (Phase 16 update): el filter exige
                     `content.slotById[r.exerciseId]` truthy (no null). Si el autor
                     editó el JSON entre arranque y fin de sesión y el slot ya no
                     existe, la fila se omite silenciosamente en lugar de crashear
                     con `TypeError: Cannot read properties of null`. T-02-01 /
                     T-16-NULL intactos. -->
                <template x-for="result in summarySessionResults.filter(r => !r.correct && content.slotById[r.exerciseId])" :key="result.exerciseId">
                  <li>
                    <strong x-text="summaryVariantSurface(result).payload.prompt"></strong>

                    <template x-if="summaryVariantSurface(result).type === 'multiple-choice'">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="result.userAnswer"></span></div>
                        <div>Respuesta correcta: <strong x-text="summaryVariantSurface(result).payload.options[summaryVariantSurface(result).payload.correctIndex]"></strong></div>
                        <!--
                          Phase 7 plan 01 (D-119, EXPL-03) — Explicación
                          pedagógica en summary "Errores cometidos". Optional
                          chaining `?.payload?.explanation` defensivo (el filter
                          exterior ya excluye exerciseIds stale; el chaining añade
                          defensa-en-profundidad). `x-text` exclusivo (T-02-01).
                          Phase 16: la explicación es a nivel de slot, re-envuelta
                          en payload.explanation por `summaryVariantSurface`.
                        -->
                        <p x-show="summaryVariantSurface(result)?.payload?.explanation"
                           class="summary-error-explanation"
                           x-text="summaryVariantSurface(result).payload.explanation"></p>
                      </div>
                    </template>

                    <template x-if="summaryVariantSurface(result).type === 'word-buttons'">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="(result.userAnswer || []).join(' ')"></span></div>
                        <div>Respuesta correcta: <strong x-text="summaryVariantSurface(result).payload.answer.join(' ')"></strong></div>
                        <!-- Phase 7 plan 01 (D-119, EXPL-03) — ver comentario en multi-choice. -->
                        <p x-show="summaryVariantSurface(result)?.payload?.explanation"
                           class="summary-error-explanation"
                           x-text="summaryVariantSurface(result).payload.explanation"></p>
                      </div>
                    </template>

                    <template x-if="summaryVariantSurface(result).type === 'match' && result.userAnswer">
                      <div>
                        <div>Tu respuesta: <span class="user-answer" x-text="result.userAnswer.left + ' ↔ ' + result.userAnswer.right"></span></div>
                        <!-- WR-01 fix: lookup por ÍNDICE canónico `leftIdx`
                             (capturado en matchPickRight contra pairs[]), NO por
                             texto. Resuelve parejas duplicadas con el mismo `left`
                             (D-66 permite homónimos). Fallback `(?)` si `leftIdx`
                             no apunta a un par válido. Phase 16: `pairs` viene de
                             la variante fallada vía summaryVariantSurface. -->
                        <div>Respuesta correcta: <strong x-text="result.userAnswer.left + ' ↔ ' + (summaryVariantSurface(result).payload.pairs[result.userAnswer.leftIdx]?.[1] || '(?)')"></strong></div>
                        <!-- Phase 7 plan 01 (D-119, EXPL-03) — ver comentario en multi-choice. -->
                        <p x-show="summaryVariantSurface(result)?.payload?.explanation"
                           class="summary-error-explanation"
                           x-text="summaryVariantSurface(result).payload.explanation"></p>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
            </section>
          </template>

          <button type="button" @click="returnToHomeFromSummary">Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla CANCION-SUMMARY — resumen post-canción (Phase 13, PLAY-04) -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Resumen al terminar el recorrido (D-04, PLAY-04). Dos bloques:
          - Block A: frases falladas (tu respuesta vs traducción correcta),
            reusando el sub-template word-buttons de summary-errors PERO con el
            lookup contra `songPhraseById` (NO content.exerciseById — LINK-04).
            Las frases SIN categoría falladas TAMBIÉN aparecen aquí (D-04).
          - Block B: categorías que bajaron de estado por esto, render factual
            `antes → después` (flecha .delta-regression, SIN gamificación),
            tomado de `songSummaryDelta` (computado en completeSong contra el
            snapshot de inicio).

        Guard `songSummaryDelta` en el outer x-if (paralelo al summary de sesión
        con `summaryDelta`): evita que los bindings se evalúen sobre null durante
        el tick de unmount al volver al listado.

        T-02-01 anti-XSS: TODO el contenido de canción se renderiza con `x-text`
        (NUNCA x-html). "Tu respuesta:" / "Respuesta correcta:" son strings
        HARDCODED en el HTML.
      -->
      <template x-if="currentScreen === 'cancion-summary' && songSummaryDelta">
        <article>
          <!-- 260615-hhp: contexto de la canción de la que viene (ENCIMA del header propio, sin romperlo). -->
          <h2 class="session-context" x-text="sessionContextLabel"></h2>
          <header><h2>Canción terminada</h2></header>

          <!-- Block A — frases falladas (lookup contra songPhraseById, D-04). -->
          <template x-if="summarySessionResults.some(r => !r.correct && songPhraseById[r.exerciseId])">
            <section class="summary-errors">
              <h3>Frases falladas</h3>
              <ul>
                <template x-for="result in summarySessionResults.filter(r => !r.correct && songPhraseById[r.exerciseId])" :key="result.exerciseId">
                  <li>
                    <strong x-text="songPhraseById[result.exerciseId].payload.prompt"></strong>
                    <div>
                      <div>Tu respuesta: <span class="user-answer" x-text="(result.userAnswer || []).join(' ')"></span></div>
                      <div>Respuesta correcta: <strong x-text="songPhraseById[result.exerciseId].payload.answer.join(' ')"></strong></div>
                    </div>
                  </li>
                </template>
              </ul>
            </section>
          </template>

          <!-- Block B — categorías que bajaron de estado (factual, sin gamificación). -->
          <template x-if="songSummaryDelta.length > 0">
            <section>
              <h3>Categorías que bajaron de estado por esto</h3>
              <ul class="summary-delta">
                <template x-for="entry in songSummaryDelta" :key="entry.categoryId">
                  <li>
                    <strong x-text="entry.categoryName"></strong>:
                    <span x-text="entry.statusBefore"></span>
                    <span class="delta-arrow delta-regression">→</span>
                    <span x-text="entry.statusAfter"></span>
                  </li>
                </template>
              </ul>
            </section>
          </template>

          <button type="button" @click="returnToSongList">Volver a Canciones</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Pantalla BACKUP (D-83, D-84 — Phase 4)                            -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <!--
        Pantalla 5ª del appShell (D-84, currentScreen === 'backup'). Layout:
          - Header "Backup".
          - Línea de estado (status) reactiva sobre state.lastBackupAt.
          - 2 botones: Exportar primario / Importar secundario (D-83).
          - Input file oculto, disparado vía $refs.backupFileInput.click().
          - Área de mensajes reactiva sobre backupLastMessage (clase verde/rojo).
          - "← Volver al home" reusa requestReturnToHome (D-82); limpia el
            mensaje al salir (W-2 fix en src/screens/app.js).

        Double-defense Alpine: el outer `x-if="currentScreen === 'backup'"`
        evita que los bindings internos (backupStatusLine, backupBannerText,
        exportBackup binding) se evalúen pre-init o cuando el usuario salió de
        la pantalla — los getters internos ya tienen `if (!this.state) return ''`
        como segundo nivel de defensa (mismo patrón que summary líneas 412-441).

        Mensaje area usa `x-show` (no x-if anidado) per UI-SPEC Implementation
        Notes línea 553-556: contenido simple sin bindings nested. Optional
        chaining `backupLastMessage?.X` porque x-show mantiene el DOM montado.
      -->
      <template x-if="currentScreen === 'backup'">
        <article>
          <header><h2>Backup</h2></header>

          <p class="picker-warning" x-text="backupStatusLine"></p>

          <div class="button-row">
            <button type="button" @click="exportBackup">Exportar progreso</button>
            <button type="button" class="secondary" @click="$refs.backupFileInput.click()">Importar progreso</button>
          </div>

          <input type="file"
                 x-ref="backupFileInput"
                 accept=".json,application/json"
                 @change="onFileSelected($event)"
                 style="display: none">

          <p x-show="backupLastMessage"
             :class="backupLastMessage?.kind === 'success' ? 'backup-message-success' : 'backup-message-error'"
             x-text="backupLastMessage?.text"></p>

          <hr>
          <button type="button" class="secondary" @click="requestReturnToHome">← Volver al home</button>
        </article>
      </template>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- Confirmación inline reusable (D-27, D-43, D-44, D-76 Phase 4)    -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <div x-show="confirmDialog"
           x-cloak
           role="alertdialog"
           aria-labelledby="confirm-message"
           class="confirm-inline">
        <p id="confirm-message" x-text="confirmDialog?.message"></p>
        <!--
          Botones de confirmación (`Descartar` / `Continuar` o equivalentes).
          UAT 02-04 round 2: aplicamos `.button-row` preventivamente — el panel
          confirm aparece en D-27/D-43/D-44 con etiquetas distintas y los dos
          botones deben leerse como acciones separadas, no como un título. El
          margin override interior compacta el wrapper dentro del panel.
        -->
        <div class="button-row" style="margin: 0.5rem 0 0 0;">
          <button type="button"
                  @click="(() => { const cb = confirmDialog?.onConfirm; confirmDialog = null; if (cb) cb(); })()"
                  x-text="confirmDialog?.confirmLabel"></button>
          <button type="button"
                  class="secondary"
                  @click="(() => { const cb = confirmDialog?.onCancel; confirmDialog = null; if (cb) cb(); })()"
                  x-text="confirmDialog?.cancelLabel"></button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
